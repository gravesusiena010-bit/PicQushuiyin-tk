name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pillow opencv-python numpy
        if (Test-Path "requirements.txt") { pip install -r requirements.txt }

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --clean --collect-all cv2 --collect-all PIL --name "PicQushuiyin" watermark_remover_gui.py

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PicQushuiyin-Windows
        path: dist/PicQushuiyin/
