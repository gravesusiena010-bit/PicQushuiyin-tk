# 图片去水印工具配置文件
# 配置文件说明: 用户可以修改以下设置来自定义工具行为

[DEFAULT]
# 默认去水印算法: telea(快速) 或 ns(精细)
default_algorithm = telea

# 默认修复半径 (1-10)
default_radius = 3

# 默认输出质量 (50-100)
output_quality = 95

# 默认输出后缀
output_suffix = _no_watermark

# 日志级别: DEBUG, INFO, WARNING, ERROR
log_level = INFO

# GUI界面设置
[GUI]
# 窗口默认大小
window_width = 1000
window_height = 700

# 预览图片最大尺寸
preview_max_width = 400
preview_max_height = 300

# 界面主题色彩
theme_color = #3498db
background_color = #f0f0f0

# 批量处理设置
[BATCH]
# 支持的文件格式
supported_formats = .jpg,.jpeg,.png,.bmp,.tiff,.tif

# 最大并发处理数
max_workers = 4

# 处理超时时间(秒)
process_timeout = 300

[DISPLAY]
# 窗口标题
window_title = 图片去水印工具

# 预览窗口大小限制 (像素)
max_preview_width = 1200
max_preview_height = 800

# 是否显示处理进度
show_progress = true

[LOGGING]
# 是否启用日志记录
enable_logging = true

# 日志级别 (DEBUG/INFO/WARNING/ERROR)
log_level = INFO

# 日志文件保存天数
log_retention_days = 30

[ADVANCED]
# 是否启用批量处理确认
batch_confirmation = true

# 最大批量处理文件数
max_batch_files = 100

# 是否自动备份原文件
auto_backup = false

# 支持的图片格式
supported_formats = .jpg,.jpeg,.png,.bmp,.tiff,.tif